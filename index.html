<title>Smart Menu Translator & Bill Checker</title>
<style>
:root{--bg:#f4f1eb;--card:#fffdf9;--ink:#1b1814;--mut:#7b7268;--line:#e5ded2;--ac:#c2410c;--ac2:#f9e7dc;--bad:#b42318;--warn:#b45309;--warnbg:#fdf3e1;--ok:#15803d}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Rubik,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew","Noto Sans Arabic",sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
svg{flex:none;display:block}

h3{font-size:15px;font-weight:700;color:var(--ink);margin:0 0 12px}

.card>h3,.card>.row:first-child{padding-bottom:10px;border-bottom:1px solid var(--line);margin:0 0 12px}
p{margin:0}small,.mut{color:var(--mut);font-size:13px}.num,b.n,.pr{font-variant-numeric:tabular-nums}
.pad{padding:4px 16px;display:grid;gap:14px}

.mark{width:52px;height:52px;border-radius:14px;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ac)}

.btn:active{transform:scale(.98)}.btn.sm{padding:9px 14px;font-size:14px;border-radius:10px}

.btn.acc{background:var(--ac);color:#fff}

.ic{width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.ic:hover{background:var(--card)}[dir=rtl] .back svg{transform:scaleX(-1)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.tile{display:flex;gap:14px;align-items:center;width:100%;text-align:start;font:inherit;color:inherit;cursor:pointer;padding:16px}
.tile .e{width:44px;height:44px;border-radius:12px;background:var(--ac2);color:var(--ac);display:grid;place-items:center;flex:none}
.tile b{display:block;font-weight:600}.tile>span:nth-child(2){flex:1;min-width:0}.tile .chev{color:var(--mut)}[dir=rtl] .tile .chev{transform:scaleX(-1)}
.tile.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}.tile.main .e{background:var(--ac);color:#fff}.tile.main small,.tile.main .chev{color:inherit;opacity:.65}
.list{padding:0 16px}
.item{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.list>.item:last-child{border-bottom:0}
.item.unsure{margin:0 -16px;padding:14px 16px;background:var(--warnbg)}
.info{display:grid;gap:3px;min-width:0}.info b{overflow-wrap:anywhere;font-weight:600}
.pr{font-weight:600;color:var(--ink)}.cv{display:block;color:var(--mut);font-weight:400;font-size:12px}
.photo{display:inline-flex;align-items:center;gap:6px;margin-top:6px;min-height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--ink);box-shadow:0 1px 0 var(--line);font-size:13px;font-weight:600;text-decoration:none;width:max-content;cursor:pointer;transition:background .12s,color .12s}
.photo:hover,.photo:focus-visible{background:var(--ink);border-color:var(--ink);color:var(--bg)}.photo:active{transform:scale(.97)}.photo svg:last-child{opacity:.7}

.step{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px;flex:none;background:var(--card)}
.step.on{border-color:var(--ink)}
.step button{width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:var(--ink);font-size:18px;cursor:pointer}
.step button:hover:not(:disabled){background:var(--bg)}
.step button:disabled{opacity:.3;cursor:default}.step span{min-width:22px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.cat-tr{display:block;margin-top:2px;font-size:13px;letter-spacing:0;text-transform:none;color:var(--mut);font-weight:500}
.cat{margin:30px 0 10px;padding:2px 0 2px;padding-inline-start:12px;border-inline-start:4px solid var(--ac);font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);font-weight:700}
section:first-of-type>.cat{margin-top:18px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut);font-size:12px;font-weight:600;letter-spacing:.04em}

.ttl:focus{background:var(--card)}.ttl::placeholder{font-size:15px;font-weight:500;letter-spacing:0}
.sticky{position:fixed;inset-inline:0;bottom:0;z-index:6;max-width:520px;margin:auto;padding:0 12px calc(12px + env(safe-area-inset-bottom))}
.sticky>div{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--ink);color:var(--bg);border-radius:18px;padding:10px 10px 10px 16px;box-shadow:0 12px 32px -12px #0007}
[dir=rtl] .sticky>div{padding:10px 16px 10px 10px}
.sticky small{color:inherit;opacity:.65}.sticky b{font-size:18px}
.scan-st{display:flex;align-items:center;gap:10px;min-width:0}.scan-st .spin{width:18px;height:18px;border-width:2px}
.al{padding:12px 14px;border-radius:12px;font-size:14px;border:1px solid}
.al.bad{background:color-mix(in srgb,var(--bad) 8%,transparent);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}.al.warn{background:var(--warnbg);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}.al.info{background:var(--ac2);border-color:transparent}.al.ok{background:color-mix(in srgb,var(--ok) 8%,transparent);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.ln{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.ln:last-child{border:0}
.tot{font-size:22px;font-weight:700;letter-spacing:-.01em}
.chips{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px}.tab{flex:none;min-width:64px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 10px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;display:grid;gap:2px}.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.tab.on small{color:inherit;opacity:.7}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.sp{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:8px}.sp.done .info{opacity:.45}
.sp .r1{display:flex;justify-content:space-between;gap:10px;align-items:center}.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.panel{background:var(--bg);border-radius:12px;padding:12px;display:grid;gap:10px}.pl{display:flex;gap:14px;flex-wrap:wrap}.chk{display:flex;flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:15px}
.x{border:0;background:none;color:var(--bad);cursor:pointer;font:inherit;font-size:13px;padding:2px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.empty{text-align:center;color:var(--mut);padding:24px}
.skel{height:52px;border-radius:10px;margin:12px 0;background:linear-gradient(90deg,var(--line),color-mix(in srgb,var(--line) 40%,transparent),var(--line));background-size:200% 100%;animation:sk 1.2s ease-in-out infinite}
@keyframes sk{to{background-position:-200% 0}}
#busy{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px);display:none;place-items:center;z-index:20;color:var(--ink)}#busy.on{display:grid}
#busy>div{display:grid;gap:14px;justify-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 28px;font-weight:600}
.spin{width:32px;height:32px;border:3px solid color-mix(in srgb,currentColor 20%,transparent);border-top-color:var(--ac);border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
#toast{position:fixed;inset-inline:16px;bottom:calc(96px + env(safe-area-inset-bottom));max-width:488px;margin:auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;z-index:30;display:none}
#sheet{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:15}#sheet.on{display:flex}
#sheet .sh{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));display:grid;gap:14px}
#sheet ul{margin:0 0 4px;padding:0;list-style:none;display:grid;gap:12px}#sheet li{display:flex;gap:12px;align-items:flex-start}#sheet li svg{color:var(--ac);margin-top:1px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
.al{display:flex;gap:10px;align-items:flex-start}.al>svg{margin-top:1px}.al small{opacity:.9}
.al.bad.strong{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:500}
.al.warn.strong{border-width:1.5px}.al.pol{background:var(--ac2);border-color:transparent}.al.pol svg{color:var(--ac)}
.btn.wide{width:100%}.btn.danger{background:var(--bad);color:#fff}
.ordersum{display:grid}.ordersum h3{margin-bottom:6px}.oq{display:inline-block;min-width:30px;color:var(--ink);font-weight:700}
.actions{display:grid;gap:6px;margin-top:6px}.actions small{text-align:center;margin:0 8px 10px}.actions .btn{min-height:52px}
.link{border:0;background:none;color:var(--ac);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:6px 0}
.lbl{font-size:13px;color:var(--mut)}.field{display:grid;gap:8px}
.note{display:inline-flex;gap:8px;align-items:center;font-size:12px;color:var(--mut)}.note .spin{width:12px;height:12px;border-width:2px}
.filt{display:grid;gap:10px}.filt-btn{justify-content:flex-start;min-height:48px}.filt-btn .cnt{margin-inline-start:auto;font-size:12px;font-weight:700;color:#fff;background:var(--bad);border-radius:99px;padding:3px 10px}.filt-btn.on{box-shadow:inset 0 0 0 1.5px var(--bad)}.filt .chips{gap:6px}.filt .pill{padding:6px 12px;font-size:13px}
.pill.av{background:var(--bad);border-color:var(--bad);color:#fff}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--card);color:var(--mut)}
.search:focus-within{border-color:var(--ink)}.search input{border:0;padding:11px 0;background:transparent}.search input:focus,.search input:focus-visible{border:0;outline:none;box-shadow:none}
.ingbox{display:grid}.inglist{margin-top:6px;border:1px solid var(--line);border-radius:12px;background:var(--card);max-height:320px;overflow:auto;overscroll-behavior:contain}
.irow{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:8px 12px;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;font-size:15px;color:inherit;text-align:start;cursor:pointer}.irow:hover{background:var(--bg)}
.irow>span:nth-child(2){flex:1}.irow .ie{width:22px;text-align:center}.irow .ck{width:18px;color:var(--bad)}.irow.on{background:color-mix(in srgb,var(--bad) 9%,transparent);font-weight:600}.irow.free{background:var(--ac2);color:var(--ac);font-weight:600}
.ingclose{display:block;margin:2px auto}
.subhd{margin:0 -16px;padding:12px 16px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--mut);border-top:1px solid var(--line);background:color-mix(in srgb,var(--line) 35%,transparent);display:flex;gap:8px;flex-wrap:wrap;border-inline-start:3px solid var(--line)}
.subhd span{text-transform:none;letter-spacing:0;color:var(--mut);font-weight:500}
.item.insub{margin:0 -16px;padding-inline:16px;background:color-mix(in srgb,var(--line) 35%,transparent);border-inline-start:3px solid var(--line)}
.item.addon{padding:6px 0 10px}.item.addon .nm b{font-weight:500;font-size:14px}
/* an add-on that is also highlighted (uncertain, dimmed, in a sub-section) keeps the inner padding of the highlight */
.item.addon.unsure,.item.addon.dim,.item.addon.insub{padding-inline:16px}
/* nothing may push the page sideways on a phone */
#app{overflow-x:clip}
/* the page column never grows past the screen; long warnings wrap instead of widening it */
.pad{grid-template-columns:minmax(0,1fr)}.item>.info{flex:1 1 auto;min-width:0;grid-template-columns:minmax(0,1fr)}.photo{max-width:100%}
.avoid-b,.unsure-b{width:auto;max-width:100%;white-space:normal;justify-self:start;align-items:flex-start}.avoid-b svg,.unsure-b svg{flex:none;margin-top:2px}
.item.dim{margin:0 -16px;padding-inline:16px;background:color-mix(in srgb,var(--line) 45%,transparent)}
.item.dim .nm,.item.dim .desc,.item.dim .pr,.item.dim .tags,.item.dim .photo{opacity:.4;filter:grayscale(1)}
.avoid-b{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600;color:#fff;background:var(--bad);border-radius:8px;padding:4px 8px;width:max-content;max-width:100%}
.nm{display:flex;gap:6px;align-items:flex-start}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:3px 0}.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.tag.ok{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);font-weight:600}
.hrow{display:flex;align-items:center;gap:6px;cursor:pointer}.hrow .info{flex:1}.hrow:hover{border-color:var(--mut)}.ic.del{color:var(--bad)}.hrow .chev{color:var(--mut)}[dir=rtl] .hrow .chev{transform:scaleX(-1)}
.rit{align-items:center}.rit .info{flex:1}.end{display:grid;gap:2px;justify-items:end;text-align:end}
.rdate{display:block;padding:0 2px}
.badln{color:var(--bad)}.badln b{color:var(--bad)}
.rit.unsure{margin:0 -16px;padding-inline:16px;background:var(--warnbg)}

.chk.big{font-size:16px;font-weight:600}
.sp .info{margin-bottom:8px}.sp .acts{justify-content:flex-start;margin-top:10px}

@media(max-width:400px){.cnts{grid-template-columns:repeat(2,1fr)}}

.srow{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.srow .info{flex:1 1 180px;min-width:0}.srow.done .info b{color:var(--mut)}

.ptot{margin-top:12px;border-top:2px solid var(--line);padding-top:4px}.issues ul{margin:6px 0 0;padding-inline-start:18px;display:grid;gap:5px;font-weight:400}.cmp p{margin:0 0 12px}
.takenby{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;font-weight:600;color:var(--mut)}.takenby.full{color:var(--ink);font-size:14px}.takenby svg{color:var(--ok)}

om:id=>{V.screen='menu';V.id=id;render();scrollTo(0,0)},or:id=>{V.screen='receipt';V.id=id;render();scrollTo(0,0)},
dm:id=>{const k=S.menus.findIndex(x=>x.id===id),m=S.menus[k];confirmDel(m&&(m.title||t('untitledMenu')),t('delMenu'),()=>{S.menus=S.menus.filter(x=>x.id!==id);render();undoToast(t('deletedT'),()=>S.menus.splice(k,0,m))})},
dr:id=>{const k=S.receipts.findIndex(x=>x.id===id),r=S.receipts[k];confirmDel(r&&(r.restaurant||r.title),t('delRec'),()=>{S.receipts=S.receipts.filter(x=>x.id!==id);render();undoToast(t('deletedT'),()=>S.receipts.splice(k,0,r))})}};
const CH={
slang:v=>{S.lang=v;const l=LANGS.find(x=>x[0]===v);if(l)S.cur=l[2];render();ensureLang()},
sname:v=>{S.langName=v.trim();render();ensureLang()},scur:v=>{S.cur=v;save()},
mtitle:v=>{cm().title=v.trim();render()},rtitle:v=>{cr().title=v;render()},rrest:v=>{cr().restaurant=v.trim();render()},
ftax:v=>{cr().fees.tax=r2(v);render()},fsvc:v=>{cr().fees.service=r2(v);render()},foth:v=>{cr().fees.other=r2(v);render()},ftip:v=>{cr().fees.tip=r2(v);render()},
tipc:v=>{cr().tipCustom=r2(v);render()},splitq:(v,id,e)=>{cr().split=e.checked;render()},
eq:(v,id,e)=>{cr().equal=e.checked;render()},
shq:v=>{V.shq=+v},shp2:(v,id,e)=>{const p=+e.dataset.x,s=V.shs||(V.shs=[]);if(e.checked&&!s.includes(p))s.push(p);if(!e.checked)V.shs=s.filter(x=>x!==p)}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=ACT[b.dataset.a];a&&a(b.dataset.id,b.dataset.x,b)});
document.addEventListener('change',e=>{const b=e.target.closest('[data-c]');if(b&&CH[b.dataset.c])CH[b.dataset.c](b.value,b.dataset.id,b)});
// typing in the ingredient search only refreshes the chips, so the field keeps focus
document.addEventListener('input',e=>{if(e.target.id==='ingq'){V.ingq=e.target.value;V.ingOpen=true;paintIng()}
// the history search re-draws the list and keeps typing in the field
if(e.target.id==='dishq'){V.dq=e.target.value;V.dqId=V.id;const p=e.target.selectionStart;render();const i=$('#dishq');if(i){i.focus();i.setSelectionRange(p,p)}}
if(e.target.id==='histq'){V.hq=e.target.value;const p=e.target.selectionStart;render();const i=$('#histq');if(i){i.focus();i.setSelectionRange(p,p)}}});
// the ingredient list opens when the search field is focused and closes on a tap outside the filter card
document.addEventListener('focusin',e=>{if(e.target.id==='ingq'&&!V.ingOpen){V.ingOpen=true;paintIng()}});
document.addEventListener('pointerdown',e=>{if(e.target.closest('#ingq')){if(!V.ingOpen){V.ingOpen=true;paintIng()}}else if(V.ingOpen&&!e.target.closest('.filt')){V.ingOpen=false;paintIng()}});
document.addEventListener('keydown',e=>{
// Enter in the ingredient search marks the first ingredient in the list (the best completion of what was typed)
if(e.key==='Enter'&&e.target.id==='ingq'){e.preventDefault();const M=cm();if(!M||!norm(V.ingq))return;const k=ingMatches(M)[0];if(!k)return;V.ingq='';if(!S.avoid.includes(k))ACT.ing(null,k);else render();return}
if(e.key==='Escape'&&V.ingOpen&&!$('#sheet').classList.contains('on')){V.ingOpen=false;paintIng()}else if(e.key==='Escape'&&$('#sheet').classList.contains('on'))closeSheet();else if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-a]')){e.preventDefault();e.target.click()}});
// Where the user is (screen and scroll) is kept on the device, so when the phone closes the page while another app
// is open, reopening it returns to the same place. Home stays underneath, so Back from there still leads home.
const POSK='mrai-pos';
const savePos=()=>{if(V.screen==='setup')return;try{localStorage.setItem(POSK,JSON.stringify({...navState(),y:Math.round(scrollY),at:Date.now()}))}catch(e){}};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')savePos()});
addEventListener('pagehide',savePos);
let posT=0;addEventListener('scroll',()=>{clearTimeout(posT);posT=setTimeout(savePos,300)},{passive:true});
function resume(){let p=null;try{p=JSON.parse(localStorage.getItem(POSK)||'null')}catch(e){}
if(!S.started||!p||Date.now()-(+p.at||0)>12*36e5)return false;
const ok=p.screen==='menu'?S.menus.some(m=>m.id===p.id):p.screen==='receipt'?S.receipts.some(r=>r.id===p.id):['history','legal'].includes(p.screen);
if(!ok)return false;
V.screen='home';V.id=null;render();V.screen=p.screen;V.id=p.id||null;if(p.legal)V.legal=p.legal;render();
const y=+p.y||0;scrollTo(0,y);requestAnimationFrame(()=>scrollTo(0,y));return true}
// ?intro in the link shows the first-visit screen again (to preview it); saved data stays as it is
if(/[?&]intro\b/.test(location.search)){V.intro=true;V.screen='setup';render()}else if(!resume())render();
ensureLang(); // load the chosen language if it is not built in
(async()=>{try{if(S.rates&&Date.now()-(S.ratesAt||0)<6e4*60*12)return;const d=await(await fetch('https://open.er-api.com/v6/latest/USD')).json();if(d.rates){S.rates=d.rates;S.ratesAt=Date.now();save();if(!/input|select/i.test(document.activeElement.tagName))render()}}catch(e){}})();
</script></body></html>
